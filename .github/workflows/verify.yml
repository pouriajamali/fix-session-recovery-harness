name: Windows and Ubuntu synthetic FIX session verification
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci_policy:
    name: Changed files and documentation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node24
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event and documentation contracts
        run: python3 -m unittest discover -s .github/ci -p test_policy.py -v
      - name: Classify complete change and validate documentation
        id: scope
        run: python3 .github/ci/policy.py gate
      - name: Check actual workflow syntax and expressions
        run: python3 .github/ci/policy.py lint
      - name: Check observable HTTP transport offline
        run: python3 -m unittest discover -s tests -p project08_http_transport_test.py -v
      - name: Check draft metadata lookup offline
        run: python3 -m unittest discover -s tests -p project08_draft_metadata_test.py -v
      - name: READ_ONLY_TRANSPORT_PREFLIGHT
        if: github.ref == 'refs/tags/v0.1.0-preview.5' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_release.py transport transport-readiness
  verify:
    name: Native ${{ matrix.rid }}
    needs: ci_policy
    if: needs.ci_policy.outputs.native == 'true'
    outputs:
      win_commitment: ${{ steps.prepare.outputs.win_commitment }}
      linux_commitment: ${{ steps.prepare.outputs.linux_commitment }}
      win_available: ${{ steps.confirmed.outputs.win_available }}
      linux_available: ${{ steps.confirmed.outputs.linux_available }}
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6; Node24
        with:
          python-version: '3.12'
      - name: Fresh hosted SDK404 and exact native source qualification
        run: python tools/project08_hosted.py
      - name: Emit complete finite native proof
        run: python tools/check_release.py transport native-log
      - name: Verify crossOS carrier tools
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python tools/check_release.py transport tools
      - name: Prepare externally committed fixed handoff
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        id: prepare
        run: python tools/check_release.py transport prepare-carrier
      - name: Save fixed current-run handoff
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        id: save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: artifacts/project08-handoff/${{ matrix.rid }}
          key: ${{ steps.prepare.outputs.win_key || steps.prepare.outputs.linux_key }}
          enableCrossOsArchive: true
      - name: Confirm exact current-run entry exists
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        id: available
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: artifacts/project08-handoff/${{ matrix.rid }}
          key: ${{ steps.prepare.outputs.win_key || steps.prepare.outputs.linux_key }}
          enableCrossOsArchive: true
          lookup-only: true
          fail-on-cache-miss: true
      - name: Validate exact availability outputs
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        id: confirmed
        env:
          CACHE_SAVE_OUTCOME: ${{ steps.save.outcome }}
          CACHE_HIT: ${{ steps.available.outputs.cache-hit }}
          CACHE_PRIMARY: ${{ steps.available.outputs.cache-primary-key }}
          CACHE_MATCHED: ${{ steps.available.outputs.cache-matched-key }}
        run: python tools/check_release.py transport producer-available
  draft_metadata_recovery:
    name: Read-only draft metadata recovery
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[project08-draft-metadata-check-v1]')
    needs: ci_policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Draft visibility requires push-equivalent contents scope.
      # The audited helper performs only fixed GETs; no mutation endpoint.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node24
        with:
          persist-credentials: false
      - name: Verify actual Actions-token draft list and numeric-ID metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/project08_draft_metadata.py --tag v0.1.0-preview.5 --output "$RUNNER_TEMP/project08-metadata-recovery.json"
  release:
    name: Release aggregate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      # Read only this run's completed producer logs/cache metadata before restoration.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6; Node24
        with:
          python-version: '3.12'
      - name: Verify tools and empty isolated carrier destinations
        run: python tools/check_release.py transport tools
      - name: Verify trusted producer commitments and affirmative actual saves
        id: expected
        env:
          GH_TOKEN: ${{ github.token }}
          WIN_COMMITMENT: ${{ needs.verify.outputs.win_commitment }}
          LINUX_COMMITMENT: ${{ needs.verify.outputs.linux_commitment }}
          WIN_AVAILABLE: ${{ needs.verify.outputs.win_available }}
          LINUX_AVAILABLE: ${{ needs.verify.outputs.linux_available }}
        run: python tools/check_release.py transport expect-carriers
      - name: Restore exact Windows producer handoff
        id: win
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: artifacts/project08-handoff/win-x64
          key: ${{ steps.expected.outputs.win_key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Validate externally committed Windows bytes
        env:
          CACHE_HIT: ${{ steps.win.outputs.cache-hit }}
          CACHE_PRIMARY: ${{ steps.win.outputs.cache-primary-key }}
          CACHE_MATCHED: ${{ steps.win.outputs.cache-matched-key }}
        run: python tools/check_release.py transport accept-carrier --rid win-x64
      - name: Restore exact Linux producer handoff
        id: linux
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: artifacts/project08-handoff/linux-x64
          key: ${{ steps.expected.outputs.linux_key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Validate externally committed Linux bytes
        env:
          CACHE_HIT: ${{ steps.linux.outputs.cache-hit }}
          CACHE_PRIMARY: ${{ steps.linux.outputs.cache-primary-key }}
          CACHE_MATCHED: ${{ steps.linux.outputs.cache-matched-key }}
        run: python tools/check_release.py transport accept-carrier --rid linux-x64
      - name: Verify already-executed archives and exact source
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/check_release.py --directory artifacts/release --commit "$SOURCE_SHA" --tag "$RELEASE_TAG" --proof-root artifacts/native-proofs --run-id '${{ github.run_id }}' --stage-receipt artifacts/draft-stage-input.json
      - name: Stage tested draft without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp SIGNING-PUBLIC-KEY.pub artifacts/release/SIGNING-PUBLIC-KEY.pub
          gh release create "$RELEASE_TAG" \
            "artifacts/release/fix-session-recovery-harness-$RELEASE_TAG-win-x64.zip" \
            "artifacts/release/fix-session-recovery-harness-$RELEASE_TAG-linux-x64.tar.gz" \
            "artifacts/release/fix-session-recovery-harness-$RELEASE_TAG-source.zip" \
            artifacts/release/SHA256SUMS.txt artifacts/release/SIGNING-PUBLIC-KEY.pub \
            --verify-tag --draft --prerelease --latest=false \
            --title "$RELEASE_TAG — FIX Session Recovery Harness" \
            --notes-file docs/RELEASE-v0.1.0-preview.5.md
          python tools/project08_draft_metadata.py --tag "$RELEASE_TAG" --stage-input artifacts/draft-stage-input.json --output "$RUNNER_TEMP/project08-private-draft.json"
          python tools/check_release.py --directory artifacts/release --commit "$GITHUB_SHA" --tag "$RELEASE_TAG" \
            --stage-input artifacts/draft-stage-input.json --bind-draft "$RUNNER_TEMP/project08-private-draft.json" \
            --stage-receipt artifacts/DRAFT-STAGE.json
      - name: Emit typed finite draft receipt only
        run: python tools/check_release.py transport draft-log
