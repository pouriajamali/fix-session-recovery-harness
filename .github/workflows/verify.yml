name: Windows and Ubuntu synthetic FIX session verification
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
concurrency:
  # Main, tag and manual runs never share a pending/cancelling group.
  # A PR uses its complete merge-base delta, so its newer run includes earlier source changes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci_policy:
    name: Changed files and documentation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event and documentation contracts
        run: python3 -m unittest discover -s .github/ci -p test_policy.py -v
      - name: Classify complete change and validate documentation
        id: scope
        run: python3 .github/ci/policy.py gate
      - name: Check actual workflow syntax and expressions
        run: python3 .github/ci/policy.py lint
  verify:
    needs: ci_policy
    if: needs.ci_policy.outputs.native == 'true'
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Hosted input/profile binding is supplied only after the exact source/CI gate.
      # Local E admission cannot qualify a fresh hosted runner.
      - name: Require actual project08 hosted kernel admission before SDK actions
        shell: pwsh
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP 'project08-hosted-admission.json'
          if (!(Test-Path -LiteralPath $receipt)) { throw 'HOLD: exact hosted project08 input/profile admission is not bound' }
          $r = Get-Content -Raw -LiteralPath $receipt | ConvertFrom-Json
          if ($r.project -ne '08' -or $r.status -ne 'ADMITTED' -or $r.candidate -ne '${{ github.sha }}') { throw 'Hosted admission identity mismatch' }
          throw 'HOLD: hosted membership adapter must be bound at exact source/CI gate; no uncapped SDK fallback'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locked regressions and real owned loopback cases
        shell: pwsh
        run: |
          dotnet restore tests/SessionHarness.Tests --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/SessionHarness.Tests -c Release --no-restore -- --work artifacts/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build clean exact-commit distributable
        run: python tools/package.py --rid ${{ matrix.rid }} --commit ${{ github.sha }} --work artifacts/build --out artifacts/delivery
      - name: Extract the actual archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'artifacts/extracted with spaces' -ErrorAction Stop | Out-Null
          $archive = Get-ChildItem -LiteralPath artifacts/delivery -File
          if (@($archive).Count -ne 1) { throw 'Exactly one archive expected' }
          if ($IsWindows) { Expand-Archive -LiteralPath $archive.FullName -DestinationPath 'artifacts/extracted with spaces' }
          else { tar -xzf $archive.FullName -C 'artifacts/extracted with spaces'; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Execute own extracted apphost with fixed synthetic loopback
        shell: pwsh
        run: |
          $package = Get-ChildItem -LiteralPath 'artifacts/extracted with spaces' -Directory
          if (@($package).Count -ne 1) { throw 'Exactly one package root expected' }
          python tools/check_package.py --package $package.FullName --work 'artifacts/package checks with spaces' --commit '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: tested-${{ matrix.rid }}
          path: artifacts/delivery/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: proof-${{ matrix.rid }}
          path: |
            artifacts/tests/receipt.json
            artifacts/build/archive.json
            artifacts/package checks with spaces/receipt.json
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-*
          merge-multiple: true
          path: artifacts/release
      - uses: actions/download-artifact@v4
        with:
          pattern: proof-*
          path: artifacts/native-proofs
      - name: Verify already-executed archives and exact source
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/check_release.py --directory artifacts/release --commit "$SOURCE_SHA" --tag "$RELEASE_TAG" --proof-root artifacts/native-proofs --run-id '${{ github.run_id }}' --stage-receipt artifacts/draft-stage-input.json
      - name: Stage tested draft without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp SIGNING-PUBLIC-KEY.pub artifacts/release/SIGNING-PUBLIC-KEY.pub
          gh release create "$RELEASE_TAG" \
            "artifacts/release/fix-session-recovery-harness-$RELEASE_TAG-win-x64.zip" \
            "artifacts/release/fix-session-recovery-harness-$RELEASE_TAG-linux-x64.tar.gz" \
            "artifacts/release/fix-session-recovery-harness-$RELEASE_TAG-source.zip" \
            artifacts/release/SHA256SUMS.txt artifacts/release/SIGNING-PUBLIC-KEY.pub \
            --verify-tag --draft --prerelease --latest=false \
            --title "$RELEASE_TAG — FIX Session Recovery Harness" \
            --notes-file docs/RELEASE-v0.1.0-preview.2.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > artifacts/actual-draft.json
          python tools/check_release.py --directory artifacts/release --commit "$GITHUB_SHA" --tag "$RELEASE_TAG" \
            --stage-input artifacts/draft-stage-input.json --bind-draft artifacts/actual-draft.json \
            --stage-receipt artifacts/DRAFT-STAGE.json
      - uses: actions/upload-artifact@v4
        with:
          name: project08-draft-stage
          path: artifacts/DRAFT-STAGE.json
          retention-days: 7
          if-no-files-found: error
